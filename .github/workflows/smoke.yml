name: Recipes smoke
permissions:
  contents: read
on:
  pull_request:
  schedule:
    - cron: "23 7 * * 1" # Mondays 07:23 UTC
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  keyless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Test public claim guard
        run: python -m unittest discover -s tests -v
      - name: Check claims against canonical product facts
        run: python scripts/check_public_claims.py
      # Only the keyless recipe runs in CI — no secrets in a public repo.
      # A recipe that stops working must fail loudly, not sit broken.
      - run: python recipes/01_first_price_no_key.py
